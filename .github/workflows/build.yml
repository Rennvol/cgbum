name: build
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: cgbum-repo }
      - uses: actions/checkout@v4
        with: { repository: keiyoushi/extensions-source, path: extensions-source, fetch-depth: 1 }
      - run: |
          rm -rf extensions-source/src/id/cgbum
          cp -a cgbum-repo/src/id/cgbum extensions-source/src/id/cgbum
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - working-directory: extensions-source
        run: ./gradlew :src:id:cgbum:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: cgbum-apk, path: extensions-source/src/id/cgbum/build/outputs/apk/debug/*.apk }
